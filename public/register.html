<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Registration — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="auth-page"><section class="auth-brand"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Member Portal</small></div></div><h1>Join the library.</h1><p>Create your Member account.</p></section><section class="auth-card"><form class="auth-box" id="registerForm"><h2>Create Member account</h2><div class="form-grid"><div class="field full"><label>Full name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field full"><label>Password</label><input id="password" type="password" minlength="8" required></div></div><div class="auth-actions"><button class="btn btn-primary" style="width:100%">Create account</button></div><p class="auth-foot">Already registered? <a class="link" href="/member-login">Member Sign In</a></p></form></section></div><div id="toast" class="toast"></div><script>App.ready.then(()=>{const f=document.getElementById('registerForm'),b=f.querySelector('button');f.onsubmit=async e=>{e.preventDefault();if(!f.reportValidity())return;b.disabled=true;b.textContent='Creating…';try{const d=await App.req('register',{method:'POST',body:{name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim().toLowerCase(),phone:document.getElementById('phone').value.trim(),password:document.getElementById('password').value}});App.user=d.user;App.paint();App.toast(d.message);setTimeout(()=>App.redirectAfterAuth(d.user),250)}catch(err){App.toast(err.message,'error');b.disabled=false;b.textContent='Create account'}}})</script></body></html>
