<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fines — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Library Workspace</small></div></div><nav class="nav"><a href="/dashboard">⌂ Dashboard</a><a href="/books">▣ Books</a><a href="/librarians">♙ Librarians</a><a data-librarian-only href="/students">♙ Students</a><a data-librarian-only href="/issues">↗ Issue Desk</a><a data-librarian-only href="/returns">↙ Return Desk</a><a class="active" href="/fines">₹ Fines</a><a href="/reservations">🔖 Reservations</a><a data-librarian-only href="/activity">◷ Activity</a></nav></aside><main class="main"><header class="topbar"><h1>Fines</h1><button class="btn btn-danger" data-logout>Logout</button></header><section class="content"><div class="page-title"><h2 data-librarian-only>Fine management</h2><h2 data-member-only>My fines</h2><p>Late fines are calculated at ₹5 per overdue day.</p></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th data-librarian-only>Student</th><th>Book</th><th>Amount</th><th>Status</th><th data-librarian-only>Due date</th><th data-librarian-only>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div id="toast" class="toast"></div><script>async function load(){try{const d=await App.req(App.user.role==='assistant'?'all-fines':'fines');document.getElementById('rows').innerHTML=d.fines.length?d.fines.map(f=>`<tr><td ${App.user.role==='student'?'style="display:none"':''}><strong>${App.esc(f.full_name||'')}</strong><small style="display:block;color:var(--muted)">${App.esc(f.student_id||'')}</small></td><td>${App.esc(f.title)}</td><td><strong>${App.money(f.amount)}</strong></td><td><span class="badge ${f.status==='unpaid'||f.status==='pending_on_return'?'badge-danger':'badge-success'}">${f.status==='pending_on_return'?'Pending on return':f.status}</span></td><td ${App.user.role==='student'?'style="display:none"':''}>${f.due_date||'—'}</td><td ${App.user.role==='student'?'style="display:none"':''}>${f.id && f.status==='unpaid'?`<button class="btn btn-success" onclick="handle(${f.id},'paid')">Paid</button> <button class="btn btn-soft" onclick="handle(${f.id},'waived')">Waive</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">No fines found.</td></tr>'}catch(e){App.toast(e.message,'error')}}async function handle(id,status){try{const d=await App.req('handle-fine',{method:'POST',body:{fine_id:id,status}});App.toast(d.message);load()}catch(e){App.toast(e.message,'error')}}App.ready.then(()=>{if(!App.guard())return;load()})</script></body></html>
