<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Librarian Desk</small></div></div><nav class="nav"><a href="/dashboard">⌂ Dashboard</a><a href="/books">▣ Books</a><a href="/librarians">♙ Librarians</a><a href="/librarians">♙ Librarians</a><a href="/members">♙ Members</a><a href="/issues">↗ Issue Desk</a><a href="/returns">↙ Return Desk</a><a href="/fines">₹ Fines</a><a href="/reservations">🔖 Reservations</a><a class="active" href="/activity">◷ Activity</a></nav></aside><main class="main"><header class="topbar"><h1>Activity log</h1><button class="btn btn-danger" data-logout>Logout</button></header><section class="content"><div class="page-title"><h2>Recent system activity</h2><p>A transparent record of important library actions.</p></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div id="toast" class="toast"></div><script>App.ready.then(async()=>{if(!App.guard('assistant'))return;try{const d=await App.req('audit');document.getElementById('rows').innerHTML=d.logs.map(l=>`<tr><td>${new Date(l.created_at).toLocaleString()}</td><td>${App.esc(l.user_name)}</td><td><span class="badge badge-info">${App.esc(l.action)}</span></td><td>${App.esc(l.entity)}</td><td>${App.esc(l.details||'—')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No activity yet.</td></tr>'}catch(e){App.toast(e.message,'error')}})</script></body></html>
