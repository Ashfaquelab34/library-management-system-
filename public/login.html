<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Librarian Sign In — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="auth-page"><section class="auth-brand"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Library Staff Portal</small></div></div><h1>Librarian workspace.</h1><p>Secure library staff access.</p></section><section class="auth-card"><form class="auth-box" id="loginForm"><h2>Librarian Sign In</h2><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><br><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><div class="auth-actions"><button class="btn btn-primary" style="width:100%">Sign in</button></div><p class="auth-foot"><span id="setupLink">First time setup? <a class="link" href="/setup">Register first Librarian</a><br></span><span style="font-size:12px;color:var(--muted)">Members use the <a class="link" href="/member-login">Member Sign In</a>.</span></p><div id="error" class="notice hidden"></div></form></section></div><div id="toast" class="toast"></div><script>App.ready.then(async()=>{try{const st=await App.req('setup-status');if(st.has_librarian)document.getElementById('setupLink')?.remove()}catch(e){}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await App.req('login',{method:'POST',body:{email:document.getElementById('email').value,password:document.getElementById('password').value}});App.redirectAfterAuth(d.user)}catch(err){App.toast(err.message,'error')}}})</script></body></html>
