<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Sign In — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="auth-page"><section class="auth-brand"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Member Portal</small></div></div><h1>Your library account.</h1><p>Access your library account.</p></section><section class="auth-card"><form class="auth-box" id="loginForm"><h2>Member Sign In</h2><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><br><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><div class="auth-actions"><button class="btn btn-primary" style="width:100%">Sign in</button></div><p class="auth-foot">New member? <a class="link" href="/register">Create Member Account</a><br><span style="font-size:12px;color:var(--muted)">Librarians use the <a class="link" href="/login">Librarian Sign In</a>.</span></p><div id="error" class="notice hidden"></div></form></section></div><div id="toast" class="toast"></div><script>App.ready.then(()=>{document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await App.req('member-login',{method:'POST',body:{email:document.getElementById('email').value,password:document.getElementById('password').value}});App.redirectAfterAuth(d.user)}catch(err){App.toast(err.message,'error')}}})</script></body></html>
