<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Account</small></div></div><nav class="nav"><a href="/dashboard">⌂ Dashboard</a><a href="/books">▣ Browse Books</a><a data-member-only href="/my-books">📚 My Issues</a><a href="/reservations">🔖 My Reservations</a><a href="/fines">₹ My Fine</a><a data-librarian-only href="/members">♙ Members</a><a data-librarian-only href="/reports">▥ Reports</a><a data-librarian-only href="/settings">⚙ Settings</a><a class="active" href="/profile">👤 My Profile</a></nav></aside><main class="main"><header class="topbar"><h1>My Profile</h1><button class="btn btn-danger" data-logout>Logout</button></header><section class="content"><div class="page-title"><h2>Account details</h2><p>View or edit your own profile and change your password.</p></div><div class="grid layout-2"><div class="card"><form id="form" class="form-grid"><div class="field full"><label>Full name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" disabled></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Role</label><input id="role" disabled></div><div class="field" data-member-only><label>Member ID</label><input id="sid" disabled></div><div class="field" data-member-only><label>Member type</label><input id="type" disabled></div><div class="field full"><label>Address</label><input id="address"></div><div class="field full"><button class="btn btn-primary">Save changes</button></div></form></div><div class="card"><h2>Change password</h2><form id="pw" class="form-grid"><div class="field full"><label>Current password</label><input id="old" type="password" required></div><div class="field full"><label>New password</label><input id="newp" type="password" minlength="8" required></div><div class="field full"><label>Confirm new password</label><input id="confirm" type="password" minlength="8" required></div><div class="field full"><button class="btn btn-primary">Change password</button></div></form></div></div></section></main></div><div id="toast" class="toast"></div><script>App.ready.then(async()=>{if(!App.guard())return;try{const d=await App.req('profile'),u=d.user;name.value=u.full_name;email.value=u.email;phone.value=u.phone||'';role.value=u.role==='assistant'?'Librarian':'Member';sid.value=u.student_id||'—';type.value=u.member_type||'Student';address.value=u.address||''}catch(e){App.toast(e.message,'error')}form.onsubmit=async e=>{e.preventDefault();try{const d=await App.req('profile',{method:'PUT',body:{name:name.value,phone:phone.value,address:address.value}});App.user=d.user;App.paint();App.toast('Profile updated.')}catch(e){App.toast(e.message,'error')}};pw.onsubmit=async e=>{e.preventDefault();if(newp.value!==confirm.value)return App.toast('New passwords do not match.','error');try{const d=await App.req('change-password',{method:'POST',body:{current_password:old.value,new_password:newp.value}});pw.reset();App.toast(d.message)}catch(e){App.toast(e.message,'error')}}})</script></body></html>
