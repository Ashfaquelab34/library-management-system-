<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Account</small></div></div><nav class="nav"><a href="/dashboard">⌂ Dashboard</a><a href="/books">▣ Browse Books</a><a data-member-only href="/my-books">📚 My Issues</a><a href="/reservations">🔖 My Reservations</a><a href="/fines">₹ My Fine</a><a data-librarian-only href="/members">♙ Members</a><a data-librarian-only href="/reports">▥ Reports</a><a data-librarian-only href="/settings">⚙ Settings</a><a class="active" href="/profile">👤 My Profile</a></nav></aside><main class="main"><header class="topbar"><h1>My Profile</h1><button class="btn btn-danger" data-logout>Logout</button></header><section class="content"><div class="page-title"><h2>Account details</h2><p>View or edit your own profile and change your password.</p></div><div class="grid layout-2"><div class="card"><form id="form" class="form-grid"><div class="field full"><label>Full name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" disabled></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Role</label><input id="role" disabled></div><div class="field" data-member-only><label>Member ID</label><input id="sid" disabled></div><div class="field" data-member-only><label>Member type</label><input id="type" disabled></div><div class="field full"><label>Address</label><input id="address"></div><div class="field full"><button class="btn btn-primary">Save changes</button></div></form></div><div class="card"><h2>Change password</h2><form id="pw" class="form-grid"><div class="field full"><label>Current password</label><input id="old" type="password" required></div><div class="field full"><label>New password</label><input id="newp" type="password" minlength="8" required></div><div class="field full"><label>Confirm new password</label><input id="confirm" type="password" minlength="8" required></div><div class="field full"><button class="btn btn-primary">Change password</button></div></form></div></div></section></main></div><div id="toast" class="toast"></div>
  <script>
App.ready.then(async () => {

    if (!App.guard()) return;

    // Get elements safely — don't use global names like name, email, old, newp
    const profileForm = document.getElementById('form');
    const passwordForm = document.getElementById('pw');

    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');
    const roleInput = document.getElementById('role');
    const sidInput = document.getElementById('sid');
    const typeInput = document.getElementById('type');
    const addressInput = document.getElementById('address');

    const oldPasswordInput = document.getElementById('old');
    const newPasswordInput = document.getElementById('newp');
    const confirmPasswordInput = document.getElementById('confirm');

    // =========================
    // LOAD PROFILE
    // =========================
    async function loadProfile() {
        try {
            const response = await App.req('profile');
            const u = response.user || {};

            nameInput.value = u.full_name || '';
            emailInput.value = u.email || '';
            phoneInput.value = u.phone || '';

            roleInput.value =
                u.role === 'assistant'
                    ? 'Librarian'
                    : 'Member';

            sidInput.value = u.student_id || '—';
            typeInput.value = u.member_type || 'Student';
            addressInput.value = u.address || '';

        } catch (error) {
            App.toast(
                error.message || 'Unable to load profile.',
                'error'
            );
        }
    }

    await loadProfile();


    // =========================
    // SAVE PROFILE
    // =========================
    profileForm.addEventListener('submit', async (event) => {

        event.preventDefault();

        const fullName = nameInput.value.trim();
        const phone = phoneInput.value.trim();
        const address = addressInput.value.trim();

        if (fullName.length < 2) {
            App.toast(
                'Please enter your full name.',
                'error'
            );

            nameInput.focus();
            return;
        }

        const button = profileForm.querySelector(
            'button[type="submit"], button'
        );

        const originalText = button
            ? button.textContent
            : 'Save changes';

        try {

            if (button) {
                button.disabled = true;
                button.textContent = 'Saving...';
            }

            const response = await App.req('profile', {
                method: 'PUT',

                body: {
                    name: fullName,
                    phone: phone,
                    address: address
                }
            });

            // Update current App session data
            if (response.user) {
                App.user = response.user;
                App.paint();
            }

            // Put returned values back into fields
            if (response.user) {
                nameInput.value =
                    response.user.name ||
                    response.user.full_name ||
                    fullName;

                phoneInput.value =
                    response.user.phone || phone;
            }

            App.toast(
                response.message ||
                'Profile updated successfully.'
            );

        } catch (error) {

            console.error('Profile update error:', error);

            App.toast(
                error.message ||
                'Unable to update profile.',
                'error'
            );

        } finally {

            if (button) {
                button.disabled = false;
                button.textContent = originalText;
            }
        }
    });


    // =========================
    // CHANGE PASSWORD
    // =========================
    passwordForm.addEventListener('submit', async (event) => {

        event.preventDefault();

        const currentPassword =
            oldPasswordInput.value;

        const newPassword =
            newPasswordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        if (!currentPassword) {
            App.toast(
                'Enter your current password.',
                'error'
            );

            oldPasswordInput.focus();
            return;
        }


        if (newPassword.length < 8) {
            App.toast(
                'New password must be at least 8 characters.',
                'error'
            );

            newPasswordInput.focus();
            return;
        }


        if (newPassword !== confirmPassword) {
            App.toast(
                'New passwords do not match.',
                'error'
            );

            confirmPasswordInput.focus();
            return;
        }


        if (currentPassword === newPassword) {
            App.toast(
                'New password must be different from current password.',
                'error'
            );

            return;
        }


        const button = passwordForm.querySelector(
            'button[type="submit"], button'
        );

        const originalText = button
            ? button.textContent
            : 'Change password';


        try {

            if (button) {
                button.disabled = true;
                button.textContent = 'Changing...';
            }


            const response = await App.req(
                'change-password',
                {
                    method: 'POST',

                    body: {
                        current_password: currentPassword,
                        new_password: newPassword
                    }
                }
            );


            passwordForm.reset();

            App.toast(
                response.message ||
                'Password changed successfully.'
            );


        } catch (error) {

            console.error(
                'Password change error:',
                error
            );

            App.toast(
                error.message ||
                'Unable to change password.',
                'error'
            );

        } finally {

            if (button) {
                button.disabled = false;
                button.textContent = originalText;
            }
        }

    });

});
</script></body></html>
