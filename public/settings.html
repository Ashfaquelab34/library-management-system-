<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Settings — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Librarian Desk</small></div></div><nav class="nav"><a href="/dashboard">⌂ Dashboard</a><a href="/books">▣ Books</a><a href="/librarians">♙ Librarians</a><a href="/librarians">♙ Librarians</a><a href="/members">♙ Members</a><a href="/authors">✍ Authors</a><a href="/categories">🏷 Categories</a><a href="/issues">↗ Issue / Return</a><a href="/fines">₹ Fines</a><a href="/reservations">🔖 Reservations</a><a href="/reports">▥ Reports</a><a class="active" href="/settings">⚙ Settings</a></nav></aside><main class="main"><header class="topbar"><h1>System Settings</h1><button class="btn btn-danger" data-logout>Logout</button></header><section class="content"><div class="page-title"><h2>Library rules & details</h2></div><div class="card" style="max-width:900px"><form id="form" class="form-grid"><div class="field"><label>Loan period (days)</label><input id="loan" type="number" min="1" max="365" required></div><div class="field"><label>Fine per overdue day (₹)</label><input id="fine" type="number" min="0" step="0.01" required></div><div class="field full"><label>Library name</label><input id="lname" required></div><div class="field"><label>Librarian name</label><input id="lib"></div><div class="field"><label>Library email</label><input id="email" type="email"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field full"><label>Library address</label><input id="address"></div><div class="field full"><button class="btn btn-primary">Save settings</button></div></form></div></section></main></div><div id="toast" class="toast"></div><script>App.ready.then(async()=>{if(!App.guard('assistant'))return;try{const d=await App.req('settings'),s=d.settings;loan.value=s.loan_days;fine.value=s.fine_per_day;lname.value=s.library_name||'';lib.value=s.librarian_name||'';email.value=s.email||'';phone.value=s.phone||'';address.value=s.address||''}catch(e){App.toast(e.message,'error')}document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{const d=await App.req('settings',{method:'PUT',body:{loan_days:loan.value,fine_per_day:fine.value,library_name:lname.value,librarian_name:lib.value,email:email.value,phone:phone.value,address:address.value}});App.toast(d.message)}catch(e){App.toast(e.message,'error')}}})</script></body></html>
