<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authors — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Librarian Desk</small></div></div><nav class="nav"><a href="/dashboard">⌂ Dashboard</a><a href="/books">▣ Books</a><a href="/librarians">♙ Librarians</a><a href="/librarians">♙ Librarians</a><a href="/members">♙ Members</a><a class="active" href="/authors">✍ Authors</a><a href="/categories">🏷 Categories</a><a href="/issues">↗ Issue / Return</a><a href="/fines">₹ Fines</a><a href="/reservations">🔖 Reservations</a><a href="/reports">▥ Reports</a><a href="/settings">⚙ Settings</a></nav></aside><main class="main"><header class="topbar"><h1>Author Management</h1><button class="btn btn-danger" data-logout>Logout</button></header><section class="content"><div class="page-title"><h2>Authors</h2><p>Add, edit or delete authors. Book count shows linked titles.</p></div><div class="card"><div class="toolbar"><button class="btn btn-primary" onclick="openA()">+ Add Author</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Author</th><th>Bio</th><th>Books</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div class="modal hidden" id="aModal"><div class="modal-box"><div class="modal-head"><h2 id="aTitle">Add Author</h2><button class="close" onclick="App.close('aModal')">×</button></div><form id="aForm" class="form-grid"><input id="aid" type="hidden"><div class="field full"><label>Name</label><input id="aname" required></div><div class="field full"><label>Bio</label><textarea id="abio"></textarea></div><div class="field full"><button class="btn btn-primary">Save author</button></div></form></div></div><div id="toast" class="toast"></div><script>let authors=[];function openA(a=null){aTitle.textContent=a?'Edit Author':'Add Author';aid.value=a?.id||'';aname.value=a?.name||'';abio.value=a?.bio||'';App.open('aModal')}async function load(){try{const d=await App.req('authors');authors=d.authors;rows.innerHTML=authors.length?authors.map(a=>`<tr><td><strong>${App.esc(a.name)}</strong></td><td>${App.esc(a.bio||'—')}</td><td>${a.book_count}</td><td><button class="btn btn-soft btn-sm" onclick='openA(${JSON.stringify(a)})'>Edit</button> <button class="btn btn-danger btn-sm" onclick="delA(${a.id})">Delete</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">No authors.</td></tr>'}catch(e){App.toast(e.message,'error')}}async function delA(id){if(!confirm('Delete this author?'))return;try{const d=await App.req('author-action',{method:'POST',body:{id,action:'delete'}});App.toast(d.message);load()}catch(e){App.toast(e.message,'error')}}App.ready.then(()=>{if(!App.guard('assistant'))return;aForm.onsubmit=async e=>{e.preventDefault();try{const d=await App.req('author-action',{method:'POST',body:{id:aid.value,name:aname.value,bio:abio.value,action:'save'}});App.close('aModal');App.toast(d.message);load()}catch(e){App.toast(e.message,'error')}};load()})</script></body></html>
