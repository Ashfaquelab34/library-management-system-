<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Return Desk — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Librarian Desk</small></div></div><nav class="nav"><a href="/dashboard">⌂ Dashboard</a><a href="/books">▣ Books</a><a href="/librarians">♙ Librarians</a><a href="/librarians">♙ Librarians</a><a href="/members">♙ Members</a><a href="/issues">↗ Issue Desk</a><a class="active" href="/returns">↙ Return Desk</a><a href="/fines">₹ Fines</a><a href="/reservations">🔖 Reservations</a></nav></aside><main class="main"><header class="topbar"><h1>Return Desk</h1><button class="btn btn-danger" data-logout>Logout</button></header><section class="content"><div class="page-title"><h2>Open circulation</h2><p>Return a book and the system calculates overdue days and fine automatically.</p></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Book</th><th>Copy</th><th>Due</th><th>Overdue</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div id="toast" class="toast"></div><script>async function load(){try{const d=await App.req('all-issues');const active=d.issues.filter(i=>!i.returned_at);document.getElementById('rows').innerHTML=active.length?active.map(i=>{const over=Math.max(0,Math.floor((Date.now()-new Date(i.due_date+'T00:00:00').getTime())/86400000));return `<tr><td><strong>${App.esc(i.student_name)}</strong><small style="display:block;color:var(--muted)">${App.esc(i.student_id)}</small></td><td>${App.esc(i.title)}</td><td>${App.esc(i.accession_no)}</td><td>${i.due_date}</td><td><span class="badge ${over?'badge-danger':'badge-success'}">${over} day${over===1?'':'s'}</span></td><td><button class="btn btn-success" onclick="ret(${i.id})">Return</button></td></tr>`}).join(''):'<tr><td colspan="6" class="empty">No active issues.</td></tr>'}catch(e){App.toast(e.message,'error')}}async function ret(id){try{const d=await App.req('return',{method:'POST',body:{issue_id:id}});App.toast(d.message);load()}catch(e){App.toast(e.message,'error')}}App.ready.then(()=>{if(!App.guard('assistant'))return;load()})</script></body></html>
