<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initial Setup — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="auth-page"><section class="auth-brand"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Initial Setup</small></div></div><h1>Set up your library.</h1><p>Create the first Librarian account to start the system.</p></section><section class="auth-card"><form class="auth-box" id="setupForm"><h2>Register First Librarian</h2><div class="form-grid"><div class="field full"><label>Full name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field full"><label>Password</label><input id="password" type="password" minlength="8" required></div></div><div class="auth-actions"><button class="btn btn-primary" style="width:100%">Create Librarian</button></div><p class="auth-foot"><a class="link" href="/login">Back to sign in</a></p></form></section></div><div id="toast" class="toast"></div><script>App.ready.then(async()=>{try{const st=await App.req('setup-status');if(st.has_librarian){location.replace('/login');return}}catch(e){}const f=document.getElementById('setupForm');f.onsubmit=async e=>{e.preventDefault();if(!f.reportValidity())return;try{const d=await App.req('initial-librarian',{method:'POST',body:{name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim().toLowerCase(),phone:document.getElementById('phone').value.trim(),password:document.getElementById('password').value}});App.toast(d.message);setTimeout(()=>location.replace('/login'),500)}catch(err){App.toast(err.message,'error')}}})</script></body></html>
