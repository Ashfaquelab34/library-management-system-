<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Librarians — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Library Workspace</small></div></div><nav class="nav"><a href="/dashboard">⌂ Dashboard</a><a href="/books">▣ Books</a><a class="active" href="/librarians">♙ Librarians</a><a href="/members">♙ Members</a><a href="/authors">✍ Authors</a><a href="/categories">🏷 Categories</a><a href="/issues">↔ Issue / Return</a><a href="/fines">₹ Fines</a><a href="/reservations">🔖 Reservations</a><a href="/reports">▥ Reports</a><a href="/settings">⚙ Settings</a></nav></aside><main class="main"><header class="topbar"><h1>Librarian Management</h1><button class="btn btn-danger" data-logout>Logout</button></header><section class="content"><div class="toolbar page-title"><div><h2>Librarians</h2></div><button class="btn btn-primary" onclick="App.open('modal')">+ Add Librarian</button></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Librarian ID</th><th>Email</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div class="modal hidden" id="modal"><div class="modal-box"><div class="modal-head"><h2>Add Librarian</h2><button class="close" onclick="App.close('modal')">×</button></div><form id="form" class="form-grid"><div class="field full"><label>Full name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field full"><label>Temporary password</label><input id="password" type="password" minlength="8" required></div><div class="field full"><button class="btn btn-primary">Create Librarian</button></div></form></div></div><div id="toast" class="toast"></div><script>async function load(){try{const d=await App.req('librarians');rows.innerHTML=(d.librarians||[]).map(x=>`<tr><td><strong>${App.esc(x.full_name)}</strong></td><td><span class="badge badge-info">${App.esc(x.librarian_id||'—')}</span></td><td>${App.esc(x.email)}</td><td>${App.esc(x.phone||'—')}</td><td><span class="badge ${x.status==='active'?'badge-success':'badge-danger'}">${x.status}</span></td><td>${x.status==='active'?`<button class="btn btn-soft btn-sm" onclick="action(${x.id},'deactivate')">Deactivate</button>`:`<button class="btn btn-success btn-sm" onclick="action(${x.id},'activate')">Activate</button>`}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No Librarians found.</td></tr>'}catch(e){App.toast(e.message,'error')}}async function action(id,a){try{const d=await App.req('librarian-action',{method:'POST',body:{id,action:a}});App.toast(d.message);load()}catch(e){App.toast(e.message,'error')}}App.ready.then(()=>{if(!App.guard('assistant'))return;form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;try{const d=await App.req('librarian-create',{method:'POST',body:{name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim().toLowerCase(),phone:document.getElementById('phone').value.trim(),password:document.getElementById('password').value}});App.close('modal');form.reset();App.toast(d.message);load()}catch(e){App.toast(e.message,'error')}};load()})</script></body></html>
