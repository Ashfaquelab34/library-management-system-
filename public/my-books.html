<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Issues — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Member Panel</small></div></div><nav class="nav"><a href="/dashboard">⌂ Dashboard</a><a href="/books">▣ Library</a><a class="active" href="/my-books">📚 My Books</a><a href="/fines">₹ My Fines</a><a href="/reservations">🔖 Reservations</a><a href="/profile">⚙ Profile</a></nav></aside><main class="main"><header class="topbar"><h1>My Issues</h1><button class="btn btn-danger" data-logout>Logout</button></header><section class="content"><div class="page-title"><h2>Your issue / return history</h2><p>See active loans, due dates and overdue status.</p></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Book</th><th>Copy</th><th>Issued</th><th>Due</th><th>Status</th><th>Overdue</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div id="toast" class="toast"></div><script>App.ready.then(async()=>{if(!App.guard('student'))return;try{const d=await App.req('my-issues');document.getElementById('rows').innerHTML=d.issues.length?d.issues.map(i=>`<tr><td><strong>${App.esc(i.title)}</strong><small style="display:block;color:var(--muted)">${App.esc(i.author)}</small></td><td>${App.esc(i.accession_no)}</td><td>${i.issue_date}</td><td>${i.due_date}</td><td><span class="badge ${i.returned_at?'badge-success':Number(i.overdue_days)>0?'badge-danger':'badge-warning'}">${i.returned_at?'Returned':Number(i.overdue_days)>0?'Overdue':'Issued'}</span></td><td>${i.returned_at?'—':i.overdue_days+' day(s)'}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">You have no borrowing records yet.</td></tr>'}catch(e){App.toast(e.message,'error')}})</script></body></html>
