<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members — Library Management System</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/app.js"></script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">L</div><div><strong>Library Management System</strong><small>Librarian Desk</small></div></div><nav class="nav"><a href="/dashboard">⌂ Dashboard</a><a href="/books">▣ Books</a><a href="/librarians">♙ Librarians</a><a class="active" href="/members">♙ Members</a><a href="/authors">✍ Authors</a><a href="/categories">🏷 Categories</a><a href="/issues">↗ Issue / Return</a><a href="/fines">₹ Fines</a><a href="/reservations">🔖 Reservations</a><a href="/reports">▥ Reports</a><a href="/settings">⚙ Settings</a></nav></aside><main class="main"><header class="topbar"><div style="display:flex;gap:12px;align-items:center"><button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button><h1>Member Management</h1></div><button class="btn btn-danger" data-logout>Logout</button></header><section class="content"><div class="page-title"><h2>Members</h2><p>Add, search, view and activate/deactivate library members.</p></div><div class="card"><div class="toolbar"><input class="search" id="q" placeholder="Search name, Member ID or email..."><button class="btn btn-primary" onclick="App.open('mModal')">+ Add Member</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Member ID</th><th>Type</th><th>Email</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div class="modal hidden" id="mModal"><div class="modal-box"><div class="modal-head"><h2>Add Member</h2><button class="close" onclick="App.close('mModal')">×</button></div><form id="mForm" class="form-grid"><div class="field"><label>Full name</label><input id="mName" required></div><div class="field"><label>Email</label><input id="mEmail" type="email" required></div><div class="field"><label>Phone</label><input id="mPhone"></div><div class="field"><label>Member type</label><select id="mType"><option>Student</option><option>Faculty</option><option>Other</option></select></div><div class="field"><label>Temporary password</label><input id="mPass" value="Library@123" minlength="8"></div><div class="field full"><label>Address</label><input id="mAddress"></div><div class="field full"><button class="btn btn-primary">Create Member</button></div></form></div></div><div id="toast" class="toast"></div><script>async function load(){try{const d=await App.req('members',{query:{q:document.getElementById('q').value}});const a=d.members||d.students||[];document.getElementById('rows').innerHTML=a.length?a.map(s=>`<tr><td><strong>${App.esc(s.full_name)}</strong></td><td><span class="badge badge-info">${App.esc(s.student_id||'')}</span></td><td>${App.esc(s.member_type||'Student')}</td><td>${App.esc(s.email)}</td><td>${App.esc(s.phone||'—')}</td><td><span class="badge ${s.status==='active'?'badge-success':'badge-danger'}">${s.status}</span></td><td>${s.status==='active'?`<button class="btn btn-soft btn-sm" onclick="toggleMember(${s.id},'deactivate')">Deactivate</button>`:`<button class="btn btn-success btn-sm" onclick="toggleMember(${s.id},'activate')">Activate</button>`}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No members found.</td></tr>'}catch(e){App.toast(e.message,'error')}}async function toggleMember(id,action){try{const d=await App.req('member-action',{method:'POST',body:{member_id:id,action}});App.toast(d.message);load()}catch(e){App.toast(e.message,'error')}}App.ready.then(()=>{if(!App.guard('assistant'))return;document.getElementById('q').oninput=load;document.getElementById('mForm').onsubmit=async e=>{e.preventDefault();try{const d=await App.req('member-create',{method:'POST',body:{name:mName.value,email:mEmail.value,phone:mPhone.value,member_type:mType.value,address:mAddress.value,password:mPass.value}});App.close('mModal');mForm.reset();mPass.value='Library@123';App.toast(d.message);load()}catch(e){App.toast(e.message,'error')}};load()})</script></body></html>
